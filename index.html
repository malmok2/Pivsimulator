<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIV Simulator</title>
<meta name="description" content="입자영상유속계(PIV)의 상호상관 계산을 브라우저에서 직접 실행해 보는 시뮬레이터. 합성 입자영상의 참값과 비교해 부화소 정밀도를 확인할 수 있습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/piv.css">
</head>
<body>
<div class="page">

  <header class="masthead">
    <p class="eyebrow" data-i18n="app.eyebrow"></p>
    <h1 data-i18n="app.title"></h1>
    <p class="lede" data-i18n="app.lede"></p>
    <div class="masthead-tools">
      <button type="button" id="langBtn" class="ghost" data-i18n="app.langLabel"></button>
      <button type="button" id="themeBtn" class="ghost" data-i18n-aria="app.themeLabel" aria-label="theme">◑</button>
    </div>
  </header>

  <ol class="steps" id="steps">
    <li><button type="button" class="step" data-step="1">
      <span class="step-n" data-i18n="step.1.n"></span>
      <h3 data-i18n="step.1.t"></h3>
      <p data-i18n="step.1.d"></p>
    </button></li>
    <li><button type="button" class="step" data-step="2">
      <span class="step-n" data-i18n="step.2.n"></span>
      <h3 data-i18n="step.2.t"></h3>
      <p data-i18n="step.2.d"></p>
    </button></li>
    <li><button type="button" class="step" data-step="3">
      <span class="step-n" data-i18n="step.3.n"></span>
      <h3 data-i18n="step.3.t"></h3>
      <p data-i18n="step.3.d"></p>
    </button></li>
    <li><button type="button" class="step" data-step="4">
      <span class="step-n" data-i18n="step.4.n"></span>
      <h3 data-i18n="step.4.t"></h3>
      <p data-i18n="step.4.d"></p>
    </button></li>
  </ol>

  <div class="bench">

    <!-- ---------- stage ---------- -->
    <section class="stage-col">
      <div class="stage-bar">
        <button type="button" id="runBtn" class="run" data-i18n="run"></button>
        <button type="button" id="reshootBtn" data-i18n="reshoot" data-i18n-title="reshoot.hint"></button>
        <span class="spacer"></span>
        <label class="sr" for="bgSelect" data-i18n="view.bg"></label>
        <select id="bgSelect">
          <option value="a" data-i18n="bg.a"></option>
          <option value="blink" data-i18n="bg.blink"></option>
          <option value="pair" data-i18n="bg.pair"></option>
          <option value="speed" data-i18n="bg.speed"></option>
          <option value="vort" data-i18n="bg.vort"></option>
          <option value="err" data-i18n="bg.err"></option>
          <option value="div" data-i18n="bg.div"></option>
        </select>
      </div>

      <div class="sensor picking" id="sensor">
        <canvas id="stage" width="768" height="768"></canvas>
        <div class="stage-veil" id="veil"><span data-i18n="stage.empty"></span></div>
        <div class="progress" id="progress" style="width:0"></div>
      </div>

      <div class="stage-foot">
        <span class="bar" id="rampBar" hidden>
          <span class="num" id="rampLo">0</span>
          <span class="ramp" id="ramp"></span>
          <span class="num" id="rampHi">1</span>
          <span id="rampLabel"></span>
        </span>
        <span class="key" id="keyMeas" hidden><i></i><span data-i18n="legend.measured"></span></span>
        <span class="key" id="keyTruth" hidden><i></i><span data-i18n="legend.truth"></span></span>
        <span class="key" id="keyRej"><i></i><span data-i18n="legend.rejected"></span></span>
        <span class="spacer"></span>
        <span id="stageHint" data-i18n="stage.hint"></span>
      </div>
    </section>

    <!-- ---------- controls ---------- -->
    <aside class="panel controls">
      <div class="group">
        <h3 data-i18n="group.flow"></h3>
        <div class="field">
          <label for="flowKind" data-i18n="flow.kind"></label>
          <select id="flowKind"></select>
        </div>
        <div class="field">
          <div class="row">
            <label for="dispRange" data-i18n="flow.disp"></label>
            <span class="val" id="dispVal"></span>
          </div>
          <input type="range" id="dispRange" min="1" max="16" step="0.5" value="6">
          <p class="hint" data-i18n="flow.disp.hint"></p>
        </div>
      </div>

      <div class="group">
        <h3 data-i18n="group.record"></h3>
        <div class="field">
          <div class="row">
            <label for="seedRange" data-i18n="rec.seed"></label>
            <span class="val" id="seedVal"></span>
          </div>
          <input type="range" id="seedRange" min="1" max="40" step="1" value="14">
          <p class="hint" data-i18n="rec.seed.hint"></p>
        </div>
        <div class="field">
          <div class="row">
            <label for="dpRange" data-i18n="rec.dp"></label>
            <span class="val" id="dpVal"></span>
          </div>
          <input type="range" id="dpRange" min="1" max="5" step="0.1" value="2.6">
          <p class="hint" data-i18n="rec.dp.hint"></p>
        </div>
        <div class="field">
          <div class="row">
            <label for="noiseRange" data-i18n="rec.noise"></label>
            <span class="val" id="noiseVal"></span>
          </div>
          <input type="range" id="noiseRange" min="0" max="12" step="0.5" value="1.5">
        </div>
        <div class="field">
          <div class="row">
            <label for="lossRange" data-i18n="rec.loss"></label>
            <span class="val" id="lossVal"></span>
          </div>
          <input type="range" id="lossRange" min="0" max="60" step="1" value="5">
          <p class="hint" data-i18n="rec.loss.hint"></p>
        </div>
        <div class="field">
          <label for="sizeSelect" data-i18n="rec.size"></label>
          <select id="sizeSelect">
            <option value="256">256 × 256 px</option>
            <option value="384" selected>384 × 384 px</option>
            <option value="512">512 × 512 px</option>
          </select>
        </div>
      </div>

      <div class="group">
        <h3 data-i18n="group.process"></h3>
        <div class="field">
          <label for="winSelect" data-i18n="proc.win"></label>
          <select id="winSelect">
            <option value="16">16 × 16 px</option>
            <option value="32" selected>32 × 32 px</option>
            <option value="64">64 × 64 px</option>
          </select>
          <p class="hint" data-i18n="proc.win.hint"></p>
        </div>
        <div class="field">
          <label for="overlapSelect" data-i18n="proc.overlap"></label>
          <select id="overlapSelect">
            <option value="0">0 %</option>
            <option value="0.25">25 %</option>
            <option value="0.5" selected>50 %</option>
            <option value="0.75">75 %</option>
          </select>
        </div>
        <div class="field">
          <label for="passesSelect" data-i18n="proc.passes"></label>
          <select id="passesSelect">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
          </select>
          <p class="hint" data-i18n="proc.passes.hint"></p>
        </div>
        <div class="field">
          <label for="subpixSelect" data-i18n="proc.subpixel"></label>
          <select id="subpixSelect">
            <option value="gauss" data-i18n="sp.gauss"></option>
            <option value="parabolic" data-i18n="sp.parabolic"></option>
            <option value="centroid" data-i18n="sp.centroid"></option>
          </select>
        </div>
        <div class="field">
          <label for="threshSelect" data-i18n="proc.threshold"></label>
          <select id="threshSelect">
            <option value="1.5">1.5</option>
            <option value="2" selected>2.0</option>
            <option value="3">3.0</option>
            <option value="1000">off</option>
          </select>
        </div>
      </div>

      <div class="group">
        <h3 data-i18n="group.view"></h3>
        <div class="field">
          <label data-i18n="view.overlay"></label>
          <div class="seg" id="overlaySeg">
            <input type="checkbox" id="ovVectors" checked><label for="ovVectors"><span class="swatch" style="background:var(--laser)"></span><span data-i18n="ov.vectors"></span></label>
            <input type="checkbox" id="ovTruth"><label for="ovTruth"><span class="swatch" style="background:var(--signal)"></span><span data-i18n="ov.truth"></span></label>
            <input type="checkbox" id="ovError"><label for="ovError"><span data-i18n="ov.error"></span></label>
            <input type="checkbox" id="ovGrid"><label for="ovGrid"><span data-i18n="ov.grid"></span></label>
          </div>
        </div>
        <div class="field">
          <div class="row">
            <label for="scaleRange" data-i18n="view.scale"></label>
            <span class="val" id="scaleVal"></span>
          </div>
          <input type="range" id="scaleRange" min="0.3" max="4" step="0.1" value="1">
        </div>
      </div>
    </aside>

    <!-- ---------- inspector ---------- -->
    <aside class="panel inspector">
      <div class="insp-head">
        <h2 data-i18n="insp.title"></h2>
        <p data-i18n="insp.sub"></p>
      </div>
      <div class="insp-body">
        <p class="hint" id="inspPick" data-i18n="insp.pick"></p>
        <div id="inspContent" hidden>
          <div class="pair">
            <div class="tile">
              <span class="cap" data-i18n="insp.winA"></span>
              <canvas id="winA" width="240" height="240"></canvas>
            </div>
            <div class="tile">
              <span class="cap" data-i18n="insp.winB"></span>
              <canvas id="winB" width="240" height="240"></canvas>
            </div>
          </div>
          <div class="tile" style="margin-top:12px">
            <div class="corr-head">
              <span class="cap" data-i18n="insp.corr"></span>
              <span class="seg">
                <input type="radio" name="corrMode" id="corr3d" value="3d" checked><label for="corr3d" data-i18n="insp.mode3d"></label>
                <input type="radio" name="corrMode" id="corr2d" value="2d"><label for="corr2d" data-i18n="insp.mode2d"></label>
              </span>
            </div>
            <canvas id="corr" width="520" height="340"></canvas>
            <p class="hint" data-i18n="insp.corr.hint"></p>
          </div>
          <dl class="readouts" style="margin-top:12px">
            <dt data-i18n="insp.pos"></dt><dd id="rPos"></dd>
            <dt data-i18n="insp.measured"></dt><dd class="hi" id="rMeas"></dd>
            <dt data-i18n="insp.truthv"></dt><dd class="sig" id="rTruth"></dd>
            <dt data-i18n="insp.errv"></dt><dd id="rErr"></dd>
            <dt data-i18n="insp.subpix"></dt><dd id="rSub"></dd>
            <dt data-i18n="insp.shift"></dt><dd id="rShift"></dd>
            <dt data-i18n="insp.peak"></dt><dd id="rPeak"></dd>
            <dt data-i18n="insp.snr"></dt><dd id="rSnr"></dd>
            <dt data-i18n="insp.status"></dt><dd><span class="verdict" id="rStatus"></span></dd>
          </dl>
        </div>
      </div>
    </aside>
  </div>

  <!-- ---------- readout ---------- -->
  <section class="readout">
    <div class="panel hero">
      <span class="cap" data-i18n="m.rms"></span>
      <span class="big" id="rmsVal">—<small> px</small></span>
      <span class="sub" data-i18n="m.rms.sub"></span>
      <span class="fraction" id="rmsFraction"></span>
    </div>
    <div class="panel facts">
      <div>
        <h3 data-i18n="group.process"></h3>
        <table class="stats">
          <tbody>
            <tr><th data-i18n="m.vectors"></th><td id="stVectors">—</td></tr>
            <tr><th data-i18n="m.valid"></th><td id="stValid">—</td></tr>
            <tr><th data-i18n="m.peak"></th><td id="stPeak">—</td></tr>
            <tr><th data-i18n="m.bias"></th><td id="stBias">—</td></tr>
            <tr><th data-i18n="m.maxerr"></th><td id="stMax">—</td></tr>
            <tr><th data-i18n="m.passes"></th><td id="stPasses">—</td></tr>
            <tr><th data-i18n="m.time"></th><td id="stTime">—</td></tr>
          </tbody>
        </table>
      </div>
      <div>
        <h3 data-i18n="diag.title"></h3>
        <div class="diags" id="diags"></div>
      </div>
    </div>
  </section>

  <!-- ---------- tail ---------- -->
  <div class="tail">
    <section class="panel card">
      <h2 data-i18n="upload.title"></h2>
      <p class="hint" data-i18n="upload.hint"></p>
      <div class="upload-row">
        <div class="field">
          <label for="fileA" data-i18n="upload.a"></label>
          <input type="file" id="fileA" accept="image/*">
        </div>
        <div class="field">
          <label for="fileB" data-i18n="upload.b"></label>
          <input type="file" id="fileB" accept="image/*">
        </div>
      </div>
      <div class="actions">
        <button type="button" id="clearUpload" data-i18n="upload.clear"></button>
        <button type="button" id="copyCsv" data-i18n="copy.csv"></button>
      </div>
      <p class="toast" id="toast"></p>
      <textarea class="dump" id="dump" readonly hidden></textarea>
    </section>

    <section class="panel card">
      <h2 data-i18n="about.title"></h2>
      <p data-i18n="about.p1"></p>
      <p data-i18n="about.p2"></p>
      <p data-i18n="about.p3"></p>
      <p data-i18n="about.p4"></p>
      <p class="fineprint" data-i18n="about.ref" data-i18n-html></p>
      <p class="fineprint" data-i18n="about.limit"></p>
    </section>
  </div>

</div>

<script src="js/fft.js"></script>
<script src="js/colormap.js"></script>
<script src="js/flow.js"></script>
<script src="js/synth.js"></script>
<script src="js/piv.js"></script>
<script src="js/render.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
