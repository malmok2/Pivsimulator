# 엔진 검증을 통과하면 저장소 루트를 그대로 GitHub Pages 로 올린다.
# index.html 이 루트에 있고 css/ js/ 를 상대경로로 읽으므로 빌드 단계가 없다.
#
# 처음 한 번은 사람이 켜야 한다: Settings → Pages → Source → "GitHub Actions".
# Pages API 로 사이트를 만드는 권한은 워크플로 토큰에 없다. 켜기 전까지 이
# 워크플로는 실패하지 않고 안내만 남긴다.
name: Test and publish

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 엔진 정확도 검증
        run: node tests/engine.test.js
      - name: dist 가 원본과 일치하는지 확인
        run: |
          node tools/build.js
          git diff --exit-code -- dist \
            || { echo "dist/ 가 원본보다 오래되었습니다. node tools/build.js 를 돌리고 함께 커밋하세요."; exit 1; }

  deploy:
    needs: test
    # 기본 브랜치에서만 공개한다. 브랜치 이름이 바뀌어도 그대로 동작한다.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages 가 켜져 있는지 확인
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages 가 아직 켜져 있지 않습니다. Settings → Pages → Source 를 'GitHub Actions' 로 한 번만 바꾸면 다음 푸시부터 자동으로 공개됩니다."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.site.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.ready == 'true'
        with:
          path: .

      - id: deployment
        if: steps.site.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
