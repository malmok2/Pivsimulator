<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIV Simulator</title>
<meta name="description" content="입자영상유속계(PIV)의 상호상관 계산을 브라우저에서 직접 실행해 보는 시뮬레이터. 합성 입자영상의 참값과 비교해 부화소 정밀도를 확인할 수 있습니다.">
<style>
/* PIV Simulator — THINK Lab 해석도구 공통 디자인 언어.
 * 토큰과 규칙은 「디자인 지침 — THINK Lab 해석도구 공통」에서 그대로 가져왔다.
 * 흰 바닥 단일 테마 · 테두리선 대신 그림자 · 강조색은 navy 하나.
 */

:root{
  /* 바탕과 면 */
  --bg:#ffffff;
  --glass:rgba(249,250,251,.82);
  --glass2:rgba(234,237,241,.92);
  --glass3:rgba(222,227,233,.96);
  --sunk:rgba(116,127,142,.15);
  --hl:rgba(255,255,255,.92);
  --line:rgba(88,99,114,.16);

  /* 글자 */
  --text:#15181c;
  --muted:#22262b;

  /* 강조 — 하나만 */
  --accent:#0f4c81;
  --accent-press:#0b3a63;
  --accent-fg:#ffffff;
  --accent-soft:rgba(15,76,129,.11);
  --focus:rgba(15,76,129,.30);

  /* 상태 — 셋만 */
  --ok:#1d7048; --caution:#7d580f; --bad:#a83f2b;

  /* 차트 계열색 */
  --c1:#0f4c81; --c2:#a8761f; --c3:#3f7d68;
  --c4:#8c3f6d; --c5:#5a4b9c; --c6:#a83f2b;
  --band:rgba(88,99,114,.13);

  /* 그림자 — 층은 셋뿐 */
  --sh-1:0 1px 2px rgba(24,31,42,.12);
  --sh-2:0 2px 6px rgba(24,31,42,.10), 0 10px 26px rgba(24,31,42,.12);
  --sh-3:0 8px 20px rgba(24,31,42,.16), 0 28px 64px rgba(24,31,42,.20);

  --blur:blur(20px) saturate(120%);
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  --mono:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; color:var(--text); font-family:var(--font);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  background:var(--bg); overflow:hidden}

h1,h2,h3{margin:0}
p{margin:0}
.num,.tabular{font-variant-numeric:tabular-nums}

/* ── 뼈대 ─────────────────────────────────────────────────────── */

.app{display:flex; flex-direction:column; height:100dvh; min-height:0}

header{display:flex; align-items:center; gap:11px; padding:11px 18px;
  background:var(--glass); backdrop-filter:var(--blur);
  box-shadow:var(--sh-1), inset 0 -1px 0 var(--line); z-index:5}
header h1{font-size:17px; font-weight:640; letter-spacing:-.012em; white-space:nowrap}
header .tag{font-size:10.5px; font-weight:600; color:var(--accent);
  letter-spacing:.05em; text-transform:uppercase;
  background:var(--accent-soft); border-radius:7px; padding:3px 9px; white-space:nowrap}
header .spring{flex:1 1 auto; min-width:8px}
.headhint{font-size:12px; color:var(--muted); text-align:right;
  max-width:46ch; line-height:1.4}

.main{display:flex; flex:1; min-height:0}
aside{width:352px; flex:none; overflow-y:auto; overscroll-behavior:contain;
  padding:12px 13px 26px; background:var(--bg)}
.viewport{flex:1; position:relative; min-width:0; overflow:hidden;
  background:var(--glass2); box-shadow:inset 1px 0 0 var(--line)}

/* ── 컨트롤 그룹 ──────────────────────────────────────────────── */

.grp{margin-bottom:9px; border-radius:12px; background:var(--glass);
  box-shadow:var(--sh-1), inset 0 1px 0 var(--hl)}
.grp[open]{box-shadow:var(--sh-2), inset 0 1px 0 var(--hl)}
.grp > summary{display:flex; align-items:center; gap:8px; cursor:pointer;
  padding:10px 12px; list-style:none; border-radius:12px}
.grp > summary::-webkit-details-marker{display:none}
.grp > summary:hover{background:var(--glass2)}
.grp > summary:focus-visible{outline:none; box-shadow:0 0 0 3px var(--focus)}
.grp h2{font-size:11px; font-weight:640; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap}
.gstate{flex:1; font-size:11.5px; color:var(--muted); opacity:.78;
  text-align:right; font-variant-numeric:tabular-nums;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.grp[open] .gstate{display:none}
.gchev{flex:none; width:7px; height:7px; margin-left:2px;
  border-right:1.6px solid var(--muted); border-bottom:1.6px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-2px); opacity:.55; transition:transform .15s}
.grp[open] .gchev{transform:rotate(-135deg) translate(-2px,-2px)}
.grp .body{padding:2px 12px 12px}

.sub{margin-top:8px; border-radius:10px; background:var(--glass2)}
.sub > summary{display:flex; align-items:center; gap:7px; cursor:pointer;
  padding:7px 10px; list-style:none; font-size:11.5px; color:var(--muted)}
.sub > summary::-webkit-details-marker{display:none}
.sub .body{padding:0 10px 10px}

/* ── 컨트롤 세 짝 ─────────────────────────────────────────────── */

.ctrl{margin:11px 0 0}
.ctrl:first-child{margin-top:4px}
.ctrl .row{display:flex; align-items:center; justify-content:space-between; gap:8px}
.ctrl label{font-size:13px; color:var(--text)}
.val{display:inline-flex; align-items:baseline; gap:4px}
.num-in{width:66px; text-align:right; font-family:var(--mono); font-size:13px;
  font-variant-numeric:tabular-nums; color:var(--text);
  background:var(--glass2); border:0; border-radius:7px; padding:3px 6px;
  box-shadow:inset 0 1px 2px rgba(24,31,42,.07)}
.num-in:focus{outline:none; box-shadow:0 0 0 3px var(--focus)}
.unit{font-size:11.5px; color:var(--muted)}
.hint{display:block; font-size:12px; color:var(--muted); opacity:.85;
  text-align:right; font-variant-numeric:tabular-nums; min-height:1.2em}
.hint.warn{color:var(--caution); opacity:1}
.hint.bad{color:var(--bad); opacity:1}

input[type=range]{-webkit-appearance:none; appearance:none; width:100%;
  height:18px; margin:2px 0 0; background:transparent; cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:3px;
  background:var(--sunk); box-shadow:inset 0 1px 2px rgba(24,31,42,.14)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:14px; height:14px; margin-top:-5px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--sh-1)}
input[type=range]::-moz-range-track{height:4px; border-radius:3px; background:var(--sunk)}
input[type=range]::-moz-range-thumb{width:14px; height:14px; border:0; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--focus)}

select.pick{width:100%; font:inherit; font-size:13px; color:var(--text);
  background:var(--glass2); border:0; border-radius:8px; padding:6px 8px; cursor:pointer;
  box-shadow:inset 0 1px 2px rgba(24,31,42,.07)}
select.pick:focus{outline:none; box-shadow:0 0 0 3px var(--focus)}

/* 세그먼트 · 체크 · 버튼 */

.seg{display:inline-flex; gap:3px; padding:3px; border-radius:10px;
  background:var(--sunk); box-shadow:inset 0 1px 2px rgba(24,31,42,.10)}
.seg button{font:inherit; font-size:12px; font-weight:540; color:var(--muted);
  background:transparent; border:0; border-radius:7px; padding:4px 11px; cursor:pointer;
  white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bg); color:var(--accent); font-weight:620;
  box-shadow:var(--sh-1)}
.seg button:focus-visible{outline:none; box-shadow:0 0 0 3px var(--focus)}
.seg.wide{display:flex; width:100%}
.seg.wide button{flex:1; text-align:center}

.chk{display:flex; align-items:center; gap:8px; padding:5px 2px; cursor:pointer;
  font-size:13px; color:var(--text)}
.chk input{position:absolute; width:1px; height:1px; margin:-1px; opacity:0;
  clip-path:inset(50%); pointer-events:none}
.chk .box{flex:none; width:16px; height:16px; border-radius:5px;
  background:var(--glass2); box-shadow:inset 0 1px 2px rgba(24,31,42,.10)}
.chk input:checked + .box{background:var(--accent); box-shadow:var(--sh-1)}
.chk input:checked + .box::after{content:""; display:block; width:4px; height:8px;
  margin:2px auto 0; border-right:2px solid var(--accent-fg);
  border-bottom:2px solid var(--accent-fg); transform:rotate(42deg)}
.chk input:focus-visible + .box{box-shadow:0 0 0 3px var(--focus)}
.chk .swatch{flex:none; width:11px; height:2.5px; border-radius:2px}

.btn{display:block; width:100%; font:inherit; font-size:13px; font-weight:560;
  color:var(--text); background:var(--glass2); border:0; border-radius:10px;
  padding:9px 12px; cursor:pointer; box-shadow:var(--sh-1), inset 0 1px 0 var(--hl)}
.btn:hover{background:var(--glass3)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--focus)}
.btn.primary{color:var(--accent-fg); background:var(--accent); box-shadow:var(--sh-2)}
.btn.primary:hover{background:var(--accent-press)}
.btn[disabled]{opacity:.55; cursor:progress}
.btn + .btn{margin-top:7px}
.btnrow{display:flex; gap:7px; margin-top:9px}
.btnrow .btn{margin-top:0}

input[type=file]{width:100%; font:inherit; font-size:12px; color:var(--muted);
  background:var(--glass2); border:0; border-radius:8px; padding:6px}
input[type=file]:focus{outline:none; box-shadow:0 0 0 3px var(--focus)}

.phys{font-size:11.5px; line-height:1.7; color:var(--muted)}
.phys b{font-variant-numeric:tabular-nums; color:var(--text); font-weight:620}
.note{font-size:11.5px; line-height:1.5; color:var(--muted); margin-top:8px}
.note.ok{color:var(--ok)} .note.caution{color:var(--caution)} .note.bad{color:var(--bad)}

/* ── 뷰포트와 떠 있는 판 ──────────────────────────────────────── */

.stage-wrap{position:absolute; inset:0; display:grid; place-items:center;
  padding:14px}
#stage{display:block; max-width:100%; max-height:100%;
  border-radius:10px; box-shadow:var(--sh-2); background:var(--bg)}
.stage-wrap.picking{cursor:crosshair}

.panel{position:absolute; border-radius:12px; background:var(--glass);
  backdrop-filter:var(--blur); box-shadow:var(--sh-2), inset 0 1px 0 var(--hl);
  padding:10px 12px}
.panel h3{font-size:10.5px; font-weight:640; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px}

.p-stats{top:12px; left:12px; min-width:196px}
.p-scope{top:12px; right:12px; width:286px; max-height:calc(100% - 24px); overflow:auto}
.p-legend{bottom:12px; left:12px; max-width:340px}
.p-warn{bottom:12px; right:12px; max-width:320px;
  box-shadow:var(--sh-3), inset 0 1px 0 var(--hl)}

.stats{display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:12px}
.stats dt{color:var(--muted); opacity:.85}
.stats dd{margin:0; text-align:right; font-variant-numeric:tabular-nums; font-weight:540}
.stats dd.hero{font-size:20px; font-weight:660; letter-spacing:-.02em; color:var(--accent);
  line-height:1.2}
.stats .heroline{grid-column:1 / -1; display:flex; align-items:baseline;
  justify-content:space-between; gap:8px; margin-bottom:2px}
.stats .heroline span{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted)}
.stats .sep{grid-column:1 / -1; height:1px; margin:5px 0 4px; background:var(--line)}

.scope-pair{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.tile{display:grid; gap:3px}
.tile .cap{font-size:10px; letter-spacing:.05em; color:var(--muted); opacity:.9}
.tile canvas{display:block; width:100%; height:auto; border-radius:7px;
  background:var(--bg); box-shadow:var(--sh-1)}
.scope-head{display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin:9px 0 3px}
.readouts{display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:12px;
  margin-top:8px}
.readouts dt{color:var(--muted); opacity:.85}
.readouts dd{margin:0; text-align:right; font-variant-numeric:tabular-nums}
.readouts dd.hi{color:var(--accent); font-weight:600}
.readouts dd.alt{color:var(--c2); font-weight:600}
.verdict[data-st="0"]{color:var(--ok)}
.verdict[data-st="1"],.verdict[data-st="3"]{color:var(--caution)}
.verdict[data-st="2"]{color:var(--muted)}
.scope-empty{font-size:12px; color:var(--muted); line-height:1.5}

.bar{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.ramp{width:148px; height:9px; border-radius:3px; box-shadow:var(--sh-1)}
.legend-cap{margin-top:5px; font-size:11.5px; color:var(--muted); line-height:1.45}
.keys{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font-size:11.5px;
  color:var(--muted)}
.key{display:inline-flex; align-items:center; gap:5px}
.key i{width:15px; height:0; border-top:2.5px solid currentColor; display:inline-block}
.scalebar{display:inline-flex; align-items:center; gap:6px}
.scalebar i{height:0; border-top:2.5px solid var(--accent); display:inline-block}

.p-warn .wtitle{display:flex; align-items:center; gap:7px; font-size:12px;
  font-weight:620; color:var(--caution)}
.p-warn[data-level="bad"] .wtitle{color:var(--bad)}
.p-warn .wmark{font-size:13px; line-height:1}
.p-warn .wbody{margin-top:4px; font-size:12px; line-height:1.5; color:var(--text)}
.p-warn .wfix{margin-top:3px; font-size:12px; line-height:1.5; color:var(--muted)}

.veil{position:absolute; inset:0; display:grid; place-items:center; z-index:3;
  background:rgba(255,255,255,.72); backdrop-filter:blur(3px);
  font-size:13px; color:var(--muted)}
.progress{position:absolute; left:0; bottom:0; height:2px; background:var(--accent);
  transition:width .08s linear; z-index:4}

.toast{min-height:1.2em; font-size:11.5px; color:var(--accent); margin-top:7px}
textarea.dump{width:100%; height:110px; margin-top:8px; font-family:var(--mono);
  font-size:11px; color:var(--text); background:var(--glass2); border:0;
  border-radius:8px; padding:8px; box-shadow:inset 0 1px 2px rgba(24,31,42,.07)}
textarea.dump:focus{outline:none; box-shadow:0 0 0 3px var(--focus)}

.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap}

/* ── 좁은 화면 ────────────────────────────────────────────────── */

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto; min-height:100dvh}
  .main{flex-direction:column}
  aside{width:100%; order:2; overflow:visible}
  .viewport{order:1; min-height:52vh}
  header{flex-wrap:wrap; padding:10px 14px}
  .headhint{max-width:none; text-align:left; flex-basis:100%}
  .p-scope{position:static; width:auto; max-height:none; margin:0 12px 12px;
    backdrop-filter:none}
  .p-stats,.p-legend,.p-warn{position:static; margin:0 12px 10px}
  .viewport{display:flex; flex-direction:column; padding-bottom:12px}
  .stage-wrap{position:relative; inset:auto; flex:1; min-height:46vh}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:0s !important; animation-duration:0s !important}
}

</style>
<style>html,body{margin:0}</style>
</head>
<body>
<div class="app">

  <header>
    <h1 data-i18n="app.title"></h1>
    <span class="tag" data-i18n="app.tag"></span>
    <div class="seg" id="stepSeg">
      <button type="button" data-step="1" data-i18n="step.1.t"></button>
      <button type="button" data-step="2" data-i18n="step.2.t"></button>
      <button type="button" data-step="3" data-i18n="step.3.t"></button>
      <button type="button" data-step="4" data-i18n="step.4.t"></button>
    </div>
    <span class="spring"></span>
    <p class="headhint" id="headHint"></p>
    <div class="seg" id="langSeg">
      <button type="button" data-lang="ko" class="on">KO</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <div class="main">

    <!-- ───────── 사이드바 ───────── -->
    <aside>
      <button type="button" id="runBtn" class="btn primary" data-i18n="run"></button>
      <div class="btnrow">
        <button type="button" id="reshootBtn" class="btn" data-i18n="reshoot"></button>
        <button type="button" id="copyCsv" class="btn" data-i18n="copy.csv"></button>
      </div>
      <p class="toast" id="toast"></p>

      <details class="grp" id="gFlow" open>
        <summary>
          <h2 data-i18n="group.flow"></h2>
          <span class="gstate" id="gsFlow"></span><i class="gchev"></i>
        </summary>
        <div class="body">
          <div class="ctrl">
            <div class="row"><label for="flowKind" data-i18n="flow.kind"></label></div>
            <select class="pick" id="flowKind"></select>
            <span class="hint" id="flowHint"></span>
          </div>
          <div class="ctrl">
            <div class="row">
              <label for="dispRange" data-i18n="flow.disp"></label>
              <span class="val">
                <input class="num-in" id="dispNum" type="number" min="1" max="16" step="0.5">
                <em class="unit">px</em>
              </span>
            </div>
            <span class="hint" id="dispHint"></span>
            <input type="range" id="dispRange" min="1" max="16" step="0.5" value="6">
          </div>
        </div>
      </details>

      <details class="grp" id="gRec" open>
        <summary>
          <h2 data-i18n="group.record"></h2>
          <span class="gstate" id="gsRec"></span><i class="gchev"></i>
        </summary>
        <div class="body">
          <div class="ctrl">
            <div class="row">
              <label for="seedRange" data-i18n="rec.seed"></label>
              <span class="val">
                <input class="num-in" id="seedNum" type="number" min="1" max="40" step="1">
                <em class="unit" data-i18n="unit.count"></em>
              </span>
            </div>
            <span class="hint" id="seedHint"></span>
            <input type="range" id="seedRange" min="1" max="40" step="1" value="14">
          </div>
          <div class="ctrl">
            <div class="row">
              <label for="dpRange" data-i18n="rec.dp"></label>
              <span class="val">
                <input class="num-in" id="dpNum" type="number" min="1" max="5" step="0.1">
                <em class="unit">px</em>
              </span>
            </div>
            <span class="hint" id="dpHint"></span>
            <input type="range" id="dpRange" min="1" max="5" step="0.1" value="2.6">
          </div>
          <div class="ctrl">
            <div class="row">
              <label for="lossRange" data-i18n="rec.loss"></label>
              <span class="val">
                <input class="num-in" id="lossNum" type="number" min="0" max="60" step="1">
                <em class="unit">%</em>
              </span>
            </div>
            <span class="hint" id="lossHint"></span>
            <input type="range" id="lossRange" min="0" max="60" step="1" value="5">
          </div>
          <div class="ctrl">
            <div class="row">
              <label for="noiseRange" data-i18n="rec.noise"></label>
              <span class="val">
                <input class="num-in" id="noiseNum" type="number" min="0" max="12" step="0.5">
                <em class="unit">%</em>
              </span>
            </div>
            <span class="hint" id="noiseHint"></span>
            <input type="range" id="noiseRange" min="0" max="12" step="0.5" value="1.5">
          </div>
          <details class="sub">
            <summary data-i18n="rec.more"></summary>
            <div class="body">
              <div class="ctrl">
                <div class="row"><label for="sizeSelect" data-i18n="rec.size"></label></div>
                <select class="pick" id="sizeSelect">
                  <option value="256">256 × 256 px</option>
                  <option value="384" selected>384 × 384 px</option>
                  <option value="512">512 × 512 px</option>
                </select>
                <span class="hint" id="sizeHint"></span>
              </div>
            </div>
          </details>
        </div>
      </details>

      <details class="grp" id="gProc" open>
        <summary>
          <h2 data-i18n="group.process"></h2>
          <span class="gstate" id="gsProc"></span><i class="gchev"></i>
        </summary>
        <div class="body">
          <div class="ctrl">
            <div class="row"><label for="winSelect" data-i18n="proc.win"></label></div>
            <select class="pick" id="winSelect">
              <option value="16">16 × 16 px</option>

/* ===== js/fft.js ===== */
/* PIV Simulator — FFT (radix-2, in-place) and FFT-based cross-correlation.

      for (var start = 0; start < n; start += size) {
        for (var q = 0, k = 0; q < h; q++, k += tw) {
          var c = cos[k], s = inverse ? sin[k] : -sin[k];

          var il = off + (start + q + h) * stride;

          re[iu] += tr; im[iu] += ti;

   * a, b are raw intensities; both are mean-subtracted here.
   * out[iy*n+ix] holds the correlation for displacement (ix-n/2, iy-n/2),
   * i.e. the map is already fftshift-ed with zero shift at the centre.

    S.der = PIV.derive(S.res);
    S.truth = S.flow ? PIV.truth(S.res, S.flow) : null;
    S.speedRange = null;
    bgKey = '';
    if (S.picked >= S.res.nx * S.res.ny) S.picked = -1;
    updateStats();
    updateWarn();
    if (animate) startReveal(); else { reveal.n = S.res.nx * S.res.ny; draw(); }
    if (S.picked < 0) autoPick(); else inspect(S.picked);
  }

  function run(animate) {
    if (S.busy) return;
    S.busy = true;
    var btn = $('runBtn');
    btn.disabled = true;
    btn.textContent = t('run.busy');
    veil(t('run.busy'));
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        try {
          shoot();
          compute(animate !== false);
        } finally {
          S.busy = false;
          btn.disabled = false;
          btn.textContent = t('run.again');
          veil(null);
        }
      });
    });
  }

  /* 슬라이더를 끄는 동안 계산이 따라오지 않게 잠깐 모은다.
   * 힌트와 상태는 즉시 갱신하므로 반응은 느려지지 않는다. */
  function schedule(act) {
    clearTimeout(pending);
    pending = setTimeout(function () {
      if (act === 'shoot') run(false);
      else if (act === 'run') { compute(false); }
      else { bgKey = ''; draw(); }
    }, act === 'draw' ? 0 : 130);
  }

  function veil(text) {
    var v = $('veil');
    if (text) {
      if (v.firstElementChild) v.firstElementChild.textContent = text;
      v.hidden = false;
    } else v.hidden = true;
  }

  function startReveal() {
    var n = S.res.nx * S.res.ny;
    reveal.target = n; reveal.n = 0; reveal.t0 = 0;
    cancelAnimationFrame(reveal.raf);
    var reduce = root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { reveal.n = n; draw(); $('progress').style.width = '0'; return; }
    function frame(ts) {
      if (!reveal.t0) reveal.t0 = ts;
      var p = Math.min(1, (ts - reveal.t0) / 850);
      reveal.n = Math.round((1 - Math.pow(1 - p, 3)) * n);
      $('progress').style.width = (p < 1 ? (100 * p).toFixed(1) : 0) + '%';
      draw();
      if (p < 1) reveal.raf = requestAnimationFrame(frame);
    }
    reveal.raf = requestAnimationFrame(frame);
  }

  /* ---------- 그리기 ---------- */

  function fitCanvas() {
    if (!S.img) return 1;
    var wrap = $('stageWrap');
    var availW = Math.max(120, wrap.clientWidth - 28);
    var availH = Math.max(120, wrap.clientHeight - 28);
    var ar = S.img.width / S.img.height;
    var w = availW, h = w / ar;
    if (h > availH) { h = availH; w = h * ar; }
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    stage.style.width = Math.round(w) + 'px';
    stage.style.height = Math.round(h) + 'px';
    var bw = Math.round(w * dpr), bh = Math.round(h * dpr);
    if (stage.width !== bw || stage.height !== bh) { stage.width = bw; stage.height = bh; }
    return w;
  }

  function bgSpec() {
    var m = S.bg;
    if (!S.der) return null;
    if (m === 'speed') return { arr: S.der.mag, ramp: 'field', sym: false };
    if (m === 'vort') return { arr: S.der.vort, ramp: 'diverging', sym: true };
    if (m === 'div') return { arr: S.der.div, ramp: 'diverging', sym: true };
    if (m === 'err' && S.truth) return { arr: S.truth.err, ramp: 'field', sym: false };
    return null;
  }

  function buildBackground() {
    var W = S.img.width, H = S.img.height;
    var spec = bgSpec();
    var key = [S.bg, W, H, S.res ? S.res.ms : 0, blink.phase].join('|');
    if (key === bgKey) return;
    bgKey = key;
    if (bgCanvas.width !== W || bgCanvas.height !== H) { bgCanvas.width = W; bgCanvas.height = H; }
    var bctx = bgCanvas.getContext('2d');
    bctx.clearRect(0, 0, W, H);
    if (spec) {
      S.range = Color.niceRange(spec.arr, S.res.status, spec.sym);
      S.floored = 0;
      if (spec.sym) {
        /* 와도·발산은 벡터장을 미분한 값이라 잡음이 그대로 증폭된다. 범위를
         * 자동으로만 잡으면 참값이 0 인 장(퍼텐셜 유동)이 요란하게 보인다.
         * 측정 잡음이 채울 수 있는 만큼을 하한으로 둔다. */
        var floorV = noiseFloor();
        if (S.range[1] < floorV) { S.range = [-floorV, floorV]; S.floored = floorV; }
      }
      var mask = (S.flow && S.flow.def.mask) ? S.flow.masked : null;
      bctx.putImageData(
        R.fieldImage(bctx, S.res, spec.arr, S.range, spec.ramp, W, H, mask), 0, 0);
    } else if (S.bg === 'pair') {
      bctx.putImageData(R.pairImage(bctx, S.img.a, S.img.b, W, H), 0, 0);
    } else {
      var src = (S.bg === 'blink' && blink.phase) ? S.img.b : S.img.a;
      bctx.putImageData(R.particleImage(bctx, src, W, H), 0, 0);
    }
    updateLegend(spec);
  }

  /* 벡터장을 중앙차분하면 변위 오차 σ 가 √2·σ/간격 만큼 기울기 잡음이 된다.
   * 그 여덟 배를 색 범위의 하한으로 쓴다 — 잡음만 있는 장은 옅게 남는다. */
  function noiseFloor() {
    var sigma = S.truth ? Math.max(0.05, S.truth.rms) : 0.1;
    var f = 8 * sigma * Math.SQRT2 / S.res.step;
    var dec = Math.pow(10, Math.floor(Math.log(f) / Math.LN10));
    var m = f / dec;
    return (m <= 1.2 ? 1.2 : m <= 2 ? 2 : m <= 3 ? 3 : m <= 5 ? 5 : 10) * dec;
  }

  function draw() {
    if (!S.img) return;
    var cssW = fitCanvas();
    var W = S.img.width, k = stage.width / W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = cssVar('--bg') || '#fff';
    ctx.fillRect(0, 0, stage.width, stage.height);
    buildBackground();
    var spec = bgSpec(), onField = !!spec;
    ctx.imageSmoothingEnabled = onField;
    ctx.drawImage(bgCanvas, 0, 0, stage.width, stage.height);
    ctx.setTransform(k, 0, 0, k, 0, 0);

    /* 바탕이 어두우냐 밝으냐로 마크 색을 고른다. viridis 는 대부분 어두우니
     * 흰 화살표에 잉크 테를, 발산형과 반전한 입자영상은 밝으니 navy 화살표에
     * 흰 테를 두른다. 강조색은 어느 쪽이든 하나다. */
    var darkField = onField && spec.ramp === 'field';
    var arrow = darkField ? '#ffffff' : cssVar('--c1');
    var halo = darkField ? 'rgba(21,24,28,.55)' : 'rgba(255,255,255,.8)';
    var truthColor = cssVar('--c2');
    var reject = darkField ? '#ffd0c6' : cssVar('--bad');

    if (S.flow) {
      R.body(ctx, S.flow, onField ? cssVar('--glass2') : 'rgba(116,127,142,.16)',
        darkField ? 'rgba(255,255,255,.55)' : 'rgba(88,99,114,.45)');
    }
    if (S.ov.grid && S.res) {
      R.grid(ctx, S.res, darkField ? 'rgba(255,255,255,.35)' : 'rgba(88,99,114,.26)', 0.9 / k);
    }
    if (!S.res) return;

    var s = arrowScale();
    var showTruth = S.ov.truth && S.truth;
    if (showTruth) {
      R.truthVectors(ctx, S.res, S.truth, { scale: s, color: truthColor, lineWidth: 3.6 / k, alpha: .95 });
    }
    if (S.ov.vectors) {
      R.vectors(ctx, S.res, {
        scale: s, limit: reveal.n, lineWidth: 1.2 / k,
        color: arrow, halo: showTruth ? null : halo,
        showRejected: true, rejectedColor: reject
      });
    }
    if (S.ov.error && S.truth) {
      R.errorVectors(ctx, S.res, S.truth, { scale: s * 10, color: truthColor, lineWidth: 1.3 / k });
    }

    if (reveal.n < reveal.target && reveal.n > 0) {
      var kk = Math.min(reveal.n, reveal.target - 1);
      var i = kk % S.res.nx, j = (kk - i) / S.res.nx;
      R.windowMarker(ctx, S.res.xs[i], S.res.ys[j], S.res.win, cssVar('--accent'), 1.6 / k);
    }
    if (S.picked >= 0) {
      var pi = S.picked % S.res.nx, pj = (S.picked - pi) / S.res.nx;
      R.windowMarker(ctx, S.res.xs[pi], S.res.ys[pj], S.res.win,
        cssVar('--accent'), 1.8 / k, 'rgba(255,255,255,.8)');
    }
    updateScaleBar(cssW);
  }

  function speedRange() {
    if (!S.der) return [0, 1];
    if (!S.speedRange) S.speedRange = Color.niceRange(S.der.mag, S.res.status, false);
    return S.speedRange;
  }

  /* 화살표 길이 1.0 = 가장 긴 벡터가 격자 간격만큼 */
  function arrowScale() {
    return S.scale * (S.res.step * 0.95) / Math.max(0.3, speedRange()[1]);
  }

  /* ---------- 범례 ---------- */

  function updateLegend(spec) {
    var bar = $('rampBar');
    if (spec) {
      bar.hidden = false;
      $('ramp').style.background = Color.gradient(spec.ramp, 90);
      var dec = Math.abs(S.range[1]) < 0.1 ? 3 : (Math.abs(S.range[1]) < 2 ? 2 : 1);
      $('rampLo').textContent = fmt(S.range[0], dec);
      $('rampHi').textContent = fmt(S.range[1], dec);
    } else bar.hidden = true;
    $('legendCap').textContent = t('lc.' + S.bg) +
      (S.floored ? ' ' + tf('lc.floored', fmt(S.floored, 3)) : '');
    /* 열쇠는 화면에 실제로 그려진 색으로 — viridis 위에서는 흰 화살표다 */
    var darkField = !!(spec && spec.ramp === 'field');
    key('keyMeas', darkField ? '#ffffff' : 'var(--c1)', darkField);
    key('keyRej', darkField ? '#ffd0c6' : 'var(--bad)', darkField);
    key('keyTruth', 'var(--c2)', false);
    $('keyMeas').hidden = !S.ov.vectors;
    $('keyTruth').hidden = !(S.ov.truth && S.truth);
    $('keyRej').hidden = !S.ov.vectors;
    $('keyScale').hidden = !S.ov.vectors || !S.res;
  }

  function key(id, color, outlined) {
    var el = $(id);
    el.style.color = color;
    el.firstElementChild.style.boxShadow = outlined ? '0 0 0 1px rgba(21,24,28,.55)' : 'none';
  }

  /* 화살표 길이의 기준자 — 보기 좋은 수를 골라 그 길이만큼 선을 긋는다 */
  function updateScaleBar(cssW) {
    if (!S.res || !S.ov.vectors) return;
    var perDisp = arrowScale() * (cssW / S.img.width);   /* 화면 px / 변위 px */
    var nice = [0.5, 1, 2, 5, 10, 20], pick = nice[0];
    for (var i = 0; i < nice.length; i++) {
      pick = nice[i];
      if (nice[i] * perDisp >= 22) break;
    }
    $('scaleTick').style.width = Math.max(10, Math.min(90, pick * perDisp)).toFixed(0) + 'px';
    $('scaleText').textContent = tf('legend.scale', pick);
  }

  /* ---------- 상관 현미경 ---------- */

  function autoPick() {
    if (!S.res) return;
    var res = S.res, n = res.nx * res.ny, k, speeds = [];
    for (k = 0; k < n; k++) if (res.status[k] === 0) speeds.push(Math.hypot(res.u[k], res.v[k]));
    if (!speeds.length) return;
    speeds.sort(function (a, b) { return a - b; });
    var floor = speeds[Math.floor(speeds.length * 0.6)];
    var best = -1, bc = -1, fallback = -1, fc = -1;
    for (k = 0; k < n; k++) {
      if (res.status[k] !== 0) continue;
      var i = k % res.nx, j = (k - i) / res.nx;
      if (res.corr[k] > fc) { fc = res.corr[k]; fallback = k; }
      if (i === 0 || j === 0 || i === res.nx - 1 || j === res.ny - 1) continue;
      if (Math.hypot(res.u[k], res.v[k]) < floor) continue;
      if (res.corr[k] > bc) { bc = res.corr[k]; best = k; }
    }
    if (best < 0) best = fallback;
    if (best >= 0) inspect(best);
  }

  function inspect(index) {
    if (!S.res || index < 0 || index >= S.res.nx * S.res.ny) return;
    S.picked = index;
    S.insp = PIV.inspect(S.cfg, S.res, index);
    $('inspPick').hidden = true;
    $('inspContent').hidden = false;
    drawInspector();
    draw();
  }

  function drawInspector() {
    var ins = S.insp;
    if (!ins) return;
    R.zoom($('winA'), ins.a, ins.win);
    R.zoom($('winB'), ins.b, ins.win);
    var half = Math.min(ins.limit, S.corrMode === '3d' ? 12 : 10);
    if (S.corrMode === '3d') R.corrSurface($('corr'), ins, half, cssVar('--text'));
    else R.corrMap($('corr'), ins, half);

    var k = S.picked;
    $('rPos').textContent = Math.round(ins.cx) + ', ' + Math.round(ins.cy) + ' px';
    $('rMeas').textContent = fmt(ins.u, 3) + ', ' + fmt(ins.v, 3) + ' px';
    if (S.truth) {
      $('rTruth').textContent = fmt(S.truth.tu[k], 3) + ', ' + fmt(S.truth.tv[k], 3) + ' px';
      $('rErr').textContent = fmt(Math.hypot(ins.u - S.truth.tu[k], ins.v - S.truth.tv[k]), 3) + ' px';
    } else {
      $('rTruth').textContent = '—';
      $('rErr').textContent = '—';
    }
    $('rSub').textContent = fmt(ins.peak.sx, 3) + ', ' + fmt(ins.peak.sy, 3) + ' px';
    $('rShift').textContent = ins.shiftX + ', ' + ins.shiftY + ' px';
    $('rPeak').textContent = fmt(ins.peak.peak, 3);
    $('rSnr').textContent = fmt(ins.peak.snr, 2);
    var st = S.res.status[k], v = $('rStatus');
    v.setAttribute('data-st', st);
    v.textContent = t(st === 0 ? 'st.ok' : st === 1 ? 'st.outlier' : st === 2 ? 'st.masked' : 'st.weak');
  }

  function pickAt(clientX, clientY) {
    if (!S.res) return;
    var rect = stage.getBoundingClientRect();
    var x = (clientX - rect.left) / rect.width * S.img.width;
    var y = (clientY - rect.top) / rect.height * S.img.height;
    var i = Math.round((x - S.res.xs[0]) / S.res.step);
    var j = Math.round((y - S.res.ys[0]) / S.res.step);
    i = Math.max(0, Math.min(S.res.nx - 1, i));
    j = Math.max(0, Math.min(S.res.ny - 1, j));
    inspect(j * S.res.nx + i);
  }

  /* ---------- 측정 요약 ---------- */

  function summary() {
    var res = S.res, n = res.nx * res.ny;
    var valid = 0, masked = 0, peakSum = 0, snrSum = 0, cnt = 0;
    for (var k = 0; k < n; k++) {
      if (res.status[k] === 2) { masked++; continue; }
      cnt++;
      peakSum += res.corr[k];
      snrSum += Math.min(20, res.snr[k]);
      if (res.status[k] === 0) valid++;
    }
    return {
      n: n, masked: masked, cnt: cnt,
      meanPeak: cnt ? peakSum / cnt : 0,
      meanSnr: cnt ? snrSum / cnt : 0,
      validPct: cnt ? 100 * valid / cnt : 0
    };
  }

  function percentileSpeed(p) {
    var v = [], k;
    if (S.truth) {
      for (k = 0; k < S.truth.tu.length; k++) {
        if (S.res.status[k] === 2) continue;
        v.push(Math.hypot(S.truth.tu[k], S.truth.tv[k]));
      }
    } else if (S.der) {
      for (k = 0; k < S.der.mag.length; k++) {
        if (S.res.status[k] === 2) continue;
        v.push(S.der.mag[k]);
      }
    }
    if (!v.length) return S.disp;
    v.sort(function (a, b) { return a - b; });
    return v[Math.min(v.length - 1, Math.floor(v.length * p))];
  }

  function updateStats() {
    var res = S.res, m = summary();
    if (S.truth) {
      $('heroCap').textContent = t('m.rms');
      $('heroVal').textContent = fmt(S.truth.rms, 3) + ' px';
      $('stSubpx').textContent = S.truth.rms > 0
        ? tf('m.subpxv', Math.round(1 / S.truth.rms)) : '—';
    } else {
      $('heroCap').textContent = t('m.peakcap');
      $('heroVal').textContent = fmt(m.meanPeak, 3);
      $('stSubpx').textContent = '—';
    }
    $('stVectors').textContent = res.nx + '×' + res.ny + ' = ' + (m.n - m.masked);
    $('stValid').textContent = fmt(m.validPct, 1) + ' %';
    $('stPeak').textContent = fmt(m.meanPeak, 3);
    $('stBias').textContent = S.truth
      ? fmt(S.truth.biasX, 3) + ', ' + fmt(S.truth.biasY, 3) + ' px' : '—';
    $('stPasses').textContent = res.passes.map(function (p) { return p.win; }).join(' → ') + ' px';
    $('stTime').textContent = Math.round(res.ms) + ' ms';
  }

  /* ---------- 단계 ---------- */

  function setStep(n) {
    S.step = n;
    var btns = $('stepSeg').children;
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = (+btns[i].getAttribute('data-step') === n) ? 'on' : '';
    }
    $('headHint').textContent = n ? t('step.' + n + '.d') : '';
    if (n === 1) { S.bg = 'a'; S.ov.vectors = false; S.ov.grid = false; S.ov.truth = false; }
    else if (n === 2) { S.bg = 'blink'; S.ov.vectors = false; S.ov.grid = false; }
    else if (n === 3) { S.bg = 'a'; S.ov.vectors = false; S.ov.grid = true; }
    else if (n === 4) { S.bg = 'speed'; S.ov.vectors = true; S.ov.grid = false; }
    pushControls();
    updateStates();
    updateBlink();
    bgKey = '';
    if (n === 3 && S.res && S.picked < 0) autoPick();
    if (n === 4 && S.res) startReveal(); else draw();
  }

  function updateBlink() {
    var want = S.bg === 'blink';
    if (want === blink.on) return;
    blink.on = want;
    cancelAnimationFrame(blink.raf);
    if (!want) { blink.phase = 0; bgKey = ''; draw(); return; }
    var last = 0;
    function frame(ts) {
      if (!last) last = ts;
      if (ts - last > 420) { last = ts; blink.phase ^= 1; bgKey = ''; draw(); }
      if (blink.on) blink.raf = requestAnimationFrame(frame);
    }
    blink.raf = requestAnimationFrame(frame);
  }

  /* ---------- 내 영상 ---------- */

  function loadFile(file, which) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.max(64, Math.round(img.naturalWidth * sc));
      var h = Math.max(64, Math.round(img.naturalHeight * sc));
      var c = R.offscreen(w, h), cc = c.getContext('2d');
      cc.drawImage(img, 0, 0, w, h);
      var rec = { g: Synth.fromImageData(cc.getImageData(0, 0, w, h)), w: w, h: h };
      if (which === 'a') S.pendingA = rec; else S.pendingB = rec;
      URL.revokeObjectURL(url);
      tryUploaded();
    };
    img.onerror = function () { URL.revokeObjectURL(url); toast('copy.fail'); };
    img.src = url;
  }

  function tryUploaded() {
    if (!S.pendingA || !S.pendingB) return;
    var A = S.pendingA, B = S.pendingB, w = A.w, h = A.h, b = B.g, note = '';
    if (B.w !== w || B.h !== h) {
      var out = new Float32Array(w * h);
      for (var j = 0; j < h; j++) {
        for (var i = 0; i < w; i++) out[j * w + i] = (i < B.w && j < B.h) ? B.g[j * B.w + i] : 0;
      }
      b = out; note = 'upload.size';
    }
    S.uploaded = { a: A.g, b: b, w: w, h: h };
    S.picked = -1;
    if (note) toast(note);
    updateStates(); updateHints();
    run(true);
  }

  function toast(key, raw) {
    var el = $('toast');
    el.textContent = raw || t(key);
    if (toast.timer) clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.textContent = ''; }, 4000);
  }

  function csv() {
    var res = S.res, lines = ['x_px,y_px,dx_px,dy_px,peak_R,snr,status'];
    for (var j = 0; j < res.ny; j++) {
      for (var i = 0; i < res.nx; i++) {
        var k = j * res.nx + i;
        lines.push([res.xs[i].toFixed(1), res.ys[j].toFixed(1),
          res.u[k].toFixed(4), res.v[k].toFixed(4), res.corr[k].toFixed(4),
          Math.min(99, res.snr[k]).toFixed(2), res.status[k]].join(','));
      }
    }
    return lines.join('\n');
  }

  function showDump(text) {
    var d = $('dump');
    d.value = text; d.hidden = false; d.select();
    $('gUpload').open = true;
    toast('copy.fail');
  }

  /* ---------- 배선 ---------- */

  function applyLang(next) {
    I18N.apply(next);
    document.title = t('doc.title');
    buildFlowSelect();
    pushControls();
    updateHints(); updateStates();
    $('headHint').textContent = S.step ? t('step.' + S.step + '.d') : '';
    $('runBtn').textContent = t(S.res ? 'run.again' : 'run');
    var lb = $('langSeg').children;
    for (var i = 0; i < lb.length; i++) {
      lb[i].className = lb[i].getAttribute('data-lang') === I18N.lang ? 'on' : '';
    }
    if (S.res) { updateStats(); updateWarn(); drawInspector(); bgKey = ''; draw(); }
    try { localStorage.setItem('piv.lang', I18N.lang); } catch (e) { /* 사생활 보호 모드 */ }
  }

  function afterChange(act) {
    updateHints();
    updateStates();
    updateWarn();
    if (act === 'draw') updateBlink();
    schedule(act);
  }

  function bind() {
    NUMS.forEach(function (p) {
      var r = $(p.range), n = $(p.num);
      r.addEventListener('input', function () {
        S[p.key] = +r.value;
        n.value = fmt(S[p.key], p.dec);
        afterChange(p.act);
      });
      n.addEventListener('change', function () {
        var v = +n.value;
        if (!isFinite(v)) { n.value = fmt(S[p.key], p.dec); return; }
        v = Math.max(+r.min, Math.min(+r.max, v));
        S[p.key] = v;
        r.value = v;
        n.value = fmt(v, p.dec);
        afterChange(p.act);
      });
    });

    PICKS.forEach(function (p) {
      $(p.id).addEventListener('change', function () {
        S[p.key] = p.str ? this.value : +this.value;
        if (p.key === 'field' || p.key === 'size') {
          S.uploaded = null; S.pendingA = S.pendingB = null;
        }
        afterChange(p.act);
      });
    });

    ['ovVectors', 'ovTruth', 'ovError', 'ovGrid'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        S.ov[id.slice(2).toLowerCase()] = this.checked;   /* ovTruth -> truth */
        bgKey = '';
        draw();
      });
    });

    $('runBtn').addEventListener('click', function () { run(true); });
    $('reshootBtn').addEventListener('click', function () {
      S.rngSeed = (Math.random() * 1e9) | 0;
      S.uploaded = null; S.pendingA = S.pendingB = null;
      $('fileA').value = ''; $('fileB').value = '';
      updateStates();
      run(true);
    });
    $('copyCsv').addEventListener('click', function () {
      if (!S.res) return;
      var text = csv();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('copy.done'); },
          function () { showDump(text); });
      } else showDump(text);
    });

    $('stepSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-step]');
      if (b) setStep(+b.getAttribute('data-step'));
    });
    $('langSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-lang]');
      if (b) applyLang(b.getAttribute('data-lang'));
    });
    $('corrSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]');
      if (!b) return;
      S.corrMode = b.getAttribute('data-mode');
      var kids = this.children;
      for (var i = 0; i < kids.length; i++) kids[i].className = kids[i] === b ? 'on' : '';
      drawInspector();
    });

    var wrap = $('stageWrap');
    wrap.addEventListener('click', function (e) { pickAt(e.clientX, e.clientY); });
    wrap.setAttribute('tabindex', '0');
    wrap.addEventListener('keydown', function (e) {
      if (!S.res) return;
      var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!d) return;
      e.preventDefault();
      var k = S.picked < 0 ? 0 : S.picked;
      var i = k % S.res.nx, j = (k - i) / S.res.nx;
      i = Math.max(0, Math.min(S.res.nx - 1, i + d[0]));
      j = Math.max(0, Math.min(S.res.ny - 1, j + d[1]));
      inspect(j * S.res.nx + i);
    });

    $('fileA').addEventListener('change', function () {
      if (this.files && this.files[0]) loadFile(this.files[0], 'a');
    });
    $('fileB').addEventListener('change', function () {
      if (this.files && this.files[0]) loadFile(this.files[0], 'b');
    });
    $('clearUpload').addEventListener('click', function () {
      S.uploaded = null; S.pendingA = S.pendingB = null;
      $('fileA').value = ''; $('fileB').value = '';
      $('dump').hidden = true;
      updateStates(); updateHints();
      run(true);
    });

    var rt;
    root.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { bgKey = ''; draw(); }, 120);
    });
  }

  /* ---------- 시작 ---------- */

  function init() {
    var saved = null;
    try { saved = localStorage.getItem('piv.lang'); } catch (e) { /* 무시 */ }
    applyLang(saved === 'en' ? 'en' : 'ko');
    bind();
    pushControls();
    updateHints();
    updateStates();
    shoot();
    compute(true);
    veil(null);
    $('runBtn').textContent = t('run.again');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
