<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIV Simulator</title>
<meta name="description" content="입자영상유속계(PIV)의 상호상관 계산을 브라우저에서 직접 실행해 보는 시뮬레이터. 합성 입자영상의 참값과 비교해 부화소 정밀도를 확인할 수 있습니다.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* PIV Simulator — one stylesheet, token-driven, light and dark.
 * Palette: laser green (532 nm) for anything measured, burnt orange for the
 * exact answer and the correlation peak, cool teal-biased neutrals for paper.
 */

:root {
  --bg: #E9EEEE;
  --surface: #FCFDFD;
  --sunken: #F0F5F4;
  --ink: #0E1A1C;
  --ink-2: #3C4F53;
  --muted: #74888C;
  --line: #CFDBDA;
  --line-2: #B6C7C5;
  --laser: #0F7A57;
  --laser-ink: #0A5B41;
  --laser-soft: #D9EEE5;
  --signal: #B4480F;
  --signal-soft: #FAE4D4;
  --ok: #1E7D5E;
  --warn: #A5631A;
  --bad: #AE3827;
  --sensor: #060D0C;
  --sensor-line: #24403A;
  --shadow: 0 1px 2px rgba(14, 26, 28, .06), 0 8px 24px -16px rgba(14, 26, 28, .35);
  --theme-name: "light";
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1315;
    --surface: #121D20;
    --sunken: #0E1719;
    --ink: #E7F0EF;
    --ink-2: #AABEBE;
    --muted: #73908F;
    --line: #213236;
    --line-2: #304649;
    --laser: #46DFA0;
    --laser-ink: #8CEFC4;
    --laser-soft: #10352A;
    --signal: #FF9A55;
    --signal-soft: #3A2212;
    --ok: #5BD39B;
    --warn: #E4A94E;
    --bad: #F0705C;
    --sensor: #050A0A;
    --sensor-line: #223C37;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -18px rgba(0, 0, 0, .9);
    --theme-name: "dark";
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0B1315;
  --surface: #121D20;
  --sunken: #0E1719;
  --ink: #E7F0EF;
  --ink-2: #AABEBE;
  --muted: #73908F;
  --line: #213236;
  --line-2: #304649;
  --laser: #46DFA0;
  --laser-ink: #8CEFC4;
  --laser-soft: #10352A;
  --signal: #FF9A55;
  --signal-soft: #3A2212;
  --ok: #5BD39B;
  --warn: #E4A94E;
  --bad: #F0705C;
  --sensor: #050A0A;
  --sensor-line: #223C37;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -18px rgba(0, 0, 0, .9);
  --theme-name: "dark";
  color-scheme: dark;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans KR", "IBM Plex Sans", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

.page {
  max-width: 1440px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 56px;
}

h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.015em; }
p { margin: 0; }

.eyebrow {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--laser-ink);
  text-transform: uppercase;
}

.mono, .num {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}

/* ---- masthead --------------------------------------------------------- */

.masthead {
  display: grid;
  gap: 10px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line);
}
.masthead h1 { font-size: clamp(25px, 4.4vw, 40px); font-weight: 700; line-height: 1.14; }
.masthead .eyebrow, .masthead h1 { grid-column: 1; }
.masthead .lede {
  grid-column: 1 / -1;
  max-width: 64ch;
  color: var(--ink-2);
  font-size: 15px;
}
.masthead-tools { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }

button {
  font: inherit;
  cursor: pointer;
  border-radius: 7px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  padding: 6px 11px;
  transition: background .13s, border-color .13s, color .13s;
}
button:hover { border-color: var(--laser); color: var(--laser-ink); }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
  outline: 2px solid var(--laser);
  outline-offset: 2px;
}
.ghost { background: transparent; font-size: 13px; padding: 5px 10px; }

/* ---- the four steps --------------------------------------------------- */

.steps {
  list-style: none;
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  margin: 22px 0 0;
  padding: 0;
  counter-reset: none;
}
.steps > li { display: flex; }
.step {
  flex: 1;
  text-align: left;
  display: grid;
  gap: 3px;
  align-content: start;
  padding: 11px 13px 13px;
  border: 1px solid var(--line);
  border-top: 2px solid var(--line-2);
  border-radius: 0 0 8px 8px;
  background: var(--surface);
}
.step:hover { border-top-color: var(--laser); color: inherit; }
.step[aria-current="true"] {
  border-top-color: var(--laser);
  background: var(--laser-soft);
}
.step-n {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.step[aria-current="true"] .step-n { color: var(--laser-ink); }
.step h3 { font-size: 15px; font-weight: 600; }
.step p { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }

/* ---- bench layout ----------------------------------------------------- */

.bench {
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "stage" "controls" "inspector";
  margin-top: 18px;
}
@media (min-width: 900px) {
  .bench {
    grid-template-columns: 252px minmax(0, 1fr);
    grid-template-areas: "controls stage" "controls inspector";
    align-items: start;
  }
}
@media (min-width: 1300px) {
  .bench {
    grid-template-columns: 258px minmax(0, 1fr) 330px;
    grid-template-areas: "controls stage inspector";
  }
}
.controls { grid-area: controls; }
.stage-col { grid-area: stage; min-width: 0; }
.inspector { grid-area: inspector; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
}

/* ---- control groups --------------------------------------------------- */

.group { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.group:last-child { border-bottom: 0; }
.group > h3 {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 9px;
}
.field { display: grid; gap: 4px; margin-bottom: 11px; }
.field:last-child { margin-bottom: 0; }
.field > .row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.field label { font-size: 12.5px; color: var(--ink-2); }
.field .val {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
}
.hint { font-size: 11.5px; line-height: 1.4; color: var(--muted); }

select, input[type="file"] {
  width: 100%;
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--sunken);
  border: 1px solid var(--line-2);
  border-radius: 7px;
  padding: 6px 8px;
}
select { cursor: pointer; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 20px;
  background: transparent;
  margin: 0;
  cursor: ew-resize;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 2px;
  background: var(--line-2);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  margin-top: -5.5px;
  border-radius: 50%;
  background: var(--laser);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--laser);
}
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-2); }
input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--laser); border: 2px solid var(--surface);
}

/* segmented + chip toggles */
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg input {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px;
  opacity: 0;
  clip-path: inset(50%);
  pointer-events: none;
}
.seg label, .chip {
  font-size: 12px;
  padding: 4px 9px;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  background: var(--sunken);
  color: var(--ink-2);
  cursor: pointer;
  user-select: none;
}
.seg label:hover, .chip:hover { border-color: var(--laser); }
.seg input:checked + label, .chip[aria-pressed="true"] {
  background: var(--laser-soft);
  border-color: var(--laser);
  color: var(--laser-ink);
  font-weight: 500;
}
.seg input:focus-visible + label { outline: 2px solid var(--laser); outline-offset: 2px; }
.swatch {
  display: inline-block;
  width: 9px; height: 9px;
  margin-right: 5px;
  border-radius: 2px;
  vertical-align: baseline;
}

/* ---- stage ------------------------------------------------------------- */

.stage-col { display: grid; gap: 10px; }
.stage-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.run {
  background: var(--laser);
  border-color: var(--laser);
  color: #04120D;
  font-weight: 600;
  padding: 8px 16px;
  font-size: 14px;
}
.run:hover { filter: brightness(1.07); color: #04120D; border-color: var(--laser); }
.run[disabled] { opacity: .55; cursor: progress; }
.stage-bar .spacer { flex: 1 1 auto; }
.stage-bar select { width: auto; min-width: 150px; }

.sensor {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  background: var(--sensor);
  border: 1px solid var(--sensor-line);
  box-shadow: var(--shadow);
}
.sensor canvas { display: block; width: 100%; height: auto; }
.sensor.picking { cursor: crosshair; }
.stage-veil {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  color: #CFE3DC;
  font-size: 13px;
  background: rgba(6, 13, 12, .72);
  backdrop-filter: blur(2px);
}
.progress {
  position: absolute;
  left: 0; bottom: 0;
  height: 2px;
  background: var(--laser);
  transition: width .08s linear;
}
.stage-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  font-size: 11.5px;
  color: var(--muted);
}
.bar {
  display: flex;
  align-items: center;
  gap: 7px;
}
.bar .ramp {
  width: 128px; height: 9px;
  border-radius: 2px;
  border: 1px solid var(--line-2);
}
/* colours taken from arrows drawn on the sensor frame: show them framed the
   way they appear there, or the pale end vanishes on a light page */
.bar.on-sensor .ramp {
  border-color: var(--sensor-line);
  box-shadow: 0 0 0 3px var(--sensor);
  margin-inline: 3px;
}
.key { display: inline-flex; align-items: center; gap: 5px; }
.key i {
  width: 16px; height: 0;
  border-top: 2px solid currentColor;
  display: inline-block;
}

/* ---- inspector -------------------------------------------------------- */

.inspector { display: grid; }
.insp-head { padding: 12px 14px 0; }
.insp-head h2 { font-size: 15px; font-weight: 600; }
.insp-head p { font-size: 11.5px; color: var(--muted); }
.insp-body { padding: 12px 14px 14px; display: grid; gap: 12px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: grid; gap: 4px; }
.tile .cap {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
}
.tile canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
  background: var(--sensor);
  border: 1px solid var(--sensor-line);
}
.corr-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.readouts {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 10px;
  font-size: 12.5px;
}
.readouts dt { color: var(--muted); }
.readouts dd {
  margin: 0;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.readouts dd.hi { color: var(--laser-ink); font-weight: 500; }
.readouts dd.sig { color: var(--signal); }
.verdict { font-weight: 500; }
.verdict[data-st="0"] { color: var(--ok); }
.verdict[data-st="1"], .verdict[data-st="3"] { color: var(--warn); }
.verdict[data-st="2"] { color: var(--muted); }

/* ---- readout strip ---------------------------------------------------- */

.readout {
  margin-top: 18px;
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 820px) {
  .readout { grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); }
}
.hero { padding: 16px 18px; display: grid; gap: 2px; align-content: start; }
.hero .cap {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.hero .big {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: clamp(38px, 7vw, 54px);
  font-weight: 500;
  line-height: 1.05;
  letter-spacing: -.03em;
  color: var(--laser-ink);
}
.hero .big small { font-size: .38em; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.hero .sub { font-size: 12px; color: var(--ink-2); }
.hero .fraction {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--line-2);
  font-size: 12.5px;
  color: var(--ink-2);
}
.hero .fraction b { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink); }

.facts { padding: 14px 16px; display: grid; gap: 14px; }
@media (min-width: 620px) { .facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); } }
.facts h3 {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}
table.stats { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.stats th, table.stats td { text-align: left; padding: 3.5px 0; border-bottom: 1px solid var(--line); }
table.stats th { font-weight: 400; color: var(--muted); }
table.stats td {
  text-align: right;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
table.stats tr:last-child th, table.stats tr:last-child td { border-bottom: 0; }

.diags { display: grid; gap: 5px; }
.diag {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  gap: 7px;
  align-items: baseline;
  font-size: 12.5px;
  padding: 4px 6px;
  border-radius: 6px;
  background: var(--sunken);
}
.diag .mark { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-align: center; }
.diag[data-level="ok"] .mark { color: var(--ok); }
.diag[data-level="warn"] .mark { color: var(--warn); }
.diag[data-level="bad"] .mark { color: var(--bad); }
.diag .what { color: var(--ink-2); }
.diag .what em { font-style: normal; color: var(--muted); font-size: 11.5px; display: block; }
.diag .num { font-size: 12px; }

/* ---- footer sections -------------------------------------------------- */

.tail { margin-top: 18px; display: grid; gap: 16px; }
@media (min-width: 900px) { .tail { grid-template-columns: minmax(0, 320px) minmax(0, 1fr); } }
.card { padding: 14px 16px; }
.card h2 { font-size: 14px; font-weight: 600; margin-bottom: 7px; }
.card p, .card li { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.card p + p { margin-top: 7px; }
.card .fineprint { margin-top: 9px; font-size: 11.5px; color: var(--muted); }
.upload-row { display: grid; gap: 8px; margin: 8px 0; }
.upload-row .field { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.toast {
  font-size: 12px;
  color: var(--laser-ink);
  min-height: 1.2em;
}
textarea.dump {
  width: 100%;
  height: 120px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  background: var(--sunken);
  color: var(--ink);
  border: 1px solid var(--line-2);
  border-radius: 7px;
  padding: 8px;
  margin-top: 8px;
}

.sr {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0s !important; animation-duration: 0s !important; }
}

</style>
<style>html,body{margin:0}</style>

<body>
<div class="page">

  <header class="masthead">
    <p class="eyebrow" data-i18n="app.eyebrow"></p>
    <h1 data-i18n="app.title"></h1>
    <p class="lede" data-i18n="app.lede"></p>
    <div class="masthead-tools">
      <button type="button" id="langBtn" class="ghost" data-i18n="app.langLabel"></button>
      <button type="button" id="themeBtn" class="ghost" data-i18n-aria="app.themeLabel" aria-label="theme">◑</button>
    </div>
  </header>

  <ol class="steps" id="steps">
    <li><button type="button" class="step" data-step="1">
      <span class="step-n" data-i18n="step.1.n"></span>
      <h3 data-i18n="step.1.t"></h3>
      <p data-i18n="step.1.d"></p>
    </button></li>
    <li><button type="button" class="step" data-step="2">
      <span class="step-n" data-i18n="step.2.n"></span>
      <h3 data-i18n="step.2.t"></h3>
      <p data-i18n="step.2.d"></p>
    </button></li>
    <li><button type="button" class="step" data-step="3">
      <span class="step-n" data-i18n="step.3.n"></span>
      <h3 data-i18n="step.3.t"></h3>
      <p data-i18n="step.3.d"></p>
    </button></li>
    <li><button type="button" class="step" data-step="4">
      <span class="step-n" data-i18n="step.4.n"></span>
      <h3 data-i18n="step.4.t"></h3>
      <p data-i18n="step.4.d"></p>
    </button></li>
  </ol>

  <div class="bench">

    <!-- ---------- stage ---------- -->
    <section class="stage-col">
      <div class="stage-bar">
        <button type="button" id="runBtn" class="run" data-i18n="run"></button>
        <button type="button" id="reshootBtn" data-i18n="reshoot" data-i18n-title="reshoot.hint"></button>
        <span class="spacer"></span>
        <label class="sr" for="bgSelect" data-i18n="view.bg"></label>
        <select id="bgSelect">
          <option value="a" data-i18n="bg.a"></option>
          <option value="blink" data-i18n="bg.blink"></option>
          <option value="pair" data-i18n="bg.pair"></option>
          <option value="speed" data-i18n="bg.speed"></option>
          <option value="vort" data-i18n="bg.vort"></option>
          <option value="err" data-i18n="bg.err"></option>
          <option value="div" data-i18n="bg.div"></option>
        </select>
      </div>

      <div class="sensor picking" id="sensor">
        <canvas id="stage" width="768" height="768"></canvas>
        <div class="stage-veil" id="veil"><span data-i18n="stage.empty"></span></div>
        <div class="progress" id="progress" style="width:0"></div>
      </div>

      <div class="stage-foot">
        <span class="bar" id="rampBar" hidden>
          <span class="num" id="rampLo">0</span>
          <span class="ramp" id="ramp"></span>
          <span class="num" id="rampHi">1</span>
          <span id="rampLabel"></span>

      document.querySelector('.hero .sub').textContent = I18N.t('upload.hint');
    }

    $('stVectors').textContent = res.nx + ' × ' + res.ny + ' = ' + (n - masked);
    $('stValid').textContent = fmt(validPct, 1) + ' %';
    $('stPeak').textContent = fmt(meanPeak, 3);
    $('stBias').textContent = S.truth
      ? fmt(S.truth.biasX, 3) + ', ' + fmt(S.truth.biasY, 3) + ' px' : '—';
    $('stMax').textContent = S.truth ? fmt(S.truth.max, 2) + ' px' : '—';
    $('stPasses').textContent = res.passes.map(function (p) { return p.win; }).join(' → ') + ' px';
    $('stTime').textContent = Math.round(res.ms) + ' ms';

    syncKeys();

    /* --- health checks --- */
    var rows = [];
    var nI = S.uploaded ? null : S.seed * Math.pow(S.win / 32, 2);
    if (nI !== null) {
      rows.push(chk('diag.seed', nI >= 8 ? 'ok' : nI >= 4 ? 'warn' : 'bad',
        fmt(nI, 1) + (I18N.lang === 'ko' ? ' 개' : ''),
        nI >= 8 ? 'diag.seed.ok' : 'diag.seed.warn'));
    }
    var p98 = percentileSpeed(0.98);
    var q = p98 / (S.win / 4);
    rows.push(chk('diag.quarter', q <= 1 ? 'ok' : q <= 1.4 ? 'warn' : 'bad',
      fmt(p98, 1) + ' / ' + fmt(S.win / 4, 1) + ' px',
      q <= 1 ? 'diag.quarter.ok' : 'diag.quarter.warn'));
    if (!S.uploaded) {
      rows.push(chk('diag.dp', (S.dp >= 1.8 && S.dp <= 3.6) ? 'ok' : (S.dp >= 1.4 ? 'warn' : 'bad'),
        fmt(S.dp, 1) + ' px', (S.dp >= 1.8 && S.dp <= 3.6) ? 'diag.dp.ok' : 'diag.dp.warn'));
    }
    rows.push(chk('diag.snr', meanSnr >= 1.5 ? 'ok' : meanSnr >= 1.2 ? 'warn' : 'bad',
      fmt(meanSnr, 2), meanSnr >= 1.5 ? 'diag.snr.ok' : 'diag.snr.warn'));
    rows.push(chk('diag.valid', validPct >= 95 ? 'ok' : validPct >= 85 ? 'warn' : 'bad',
      fmt(validPct, 1) + ' %', validPct >= 95 ? 'diag.valid.ok' : 'diag.valid.warn'));
    $('diags').innerHTML = rows.join('');
  }

  /* the legend names only what is on screen, in the colour it was drawn in */
  function syncKeys() {
    var onField = !!(S.res && bgSpec());
    var rampColoured = S.ov.vectors && !onField;
    $('keyMeas').hidden = !S.ov.vectors || rampColoured;
    $('keyMeas').style.color = onField ? 'var(--ink)' : '#5BE9AC';
    $('keyTruth').hidden = !(S.ov.truth && S.truth);
    $('keyTruth').style.color = onField ? 'var(--signal)' : '#FFA362';
    $('keyRej').style.color = onField ? 'var(--bad)' : '#FF7D66';
  }

  function chk(labelKey, level, value, noteKey) {
    var mark = level === 'ok' ? '✓' : level === 'warn' ? '!' : '✕';
    return '<div class="diag" data-level="' + level + '">' +
      '<span class="mark">' + mark + '</span>' +
      '<span class="what">' + I18N.t(labelKey) + '<em>' + I18N.t(noteKey) + '</em></span>' +
      '<span class="num">' + value + '</span></div>';
  }

  function percentileSpeed(p) {
    var v = [], k;
    if (S.truth) {
      for (k = 0; k < S.truth.tu.length; k++) {
        if (S.res.status[k] === 2) continue;
        v.push(Math.hypot(S.truth.tu[k], S.truth.tv[k]));
      }
    } else {
      for (k = 0; k < S.der.mag.length; k++) {
        if (S.res.status[k] === 2) continue;
        v.push(S.der.mag[k]);
      }
    }
    if (!v.length) return 0;
    v.sort(function (a, b) { return a - b; });
    return v[Math.min(v.length - 1, Math.floor(v.length * p))];
  }

  /* ---------- story steps ------------------------------------------------ */

  function setStep(n) {
    S.step = n;
    var btns = document.querySelectorAll('.step');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-current', String(+btns[i].getAttribute('data-step') === n));
    }
    if (n === 1) {
      $('bgSelect').value = 'a';
      $('ovVectors').checked = false; $('ovGrid').checked = false;
      $('ovTruth').checked = false; $('ovError').checked = false;
    } else if (n === 2) {
      $('bgSelect').value = 'blink';
      $('ovVectors').checked = false; $('ovGrid').checked = false;
    } else if (n === 3) {
      $('bgSelect').value = 'a';
      $('ovVectors').checked = false; $('ovGrid').checked = true;
    } else if (n === 4) {
      $('bgSelect').value = 'speed';
      $('ovVectors').checked = true; $('ovGrid').checked = false;
    }
    readControls();
    updateBlink();
    if (n === 3 && S.res) {
      var mid = Math.floor(S.res.ny / 2) * S.res.nx + Math.floor(S.res.nx / 2);
      inspect(S.picked >= 0 ? S.picked : mid);
      var el = document.querySelector('.inspector');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    if (n === 4 && S.res) startReveal();
    draw();
    $('stageHint').textContent = I18N.t(n === 2 ? 'stage.blink' : 'stage.hint');
  }

  /* ---------- blink ------------------------------------------------------ */
  function updateBlink() {
    var want = S.bg === 'blink';
    if (want === blink.on) return;
    blink.on = want;
    cancelAnimationFrame(blink.raf);
    if (!want) { blink.phase = 0; bgKey = ''; draw(); return; }
    var last = 0;
    function frame(t) {
      if (!last) last = t;
      if (t - last > 420) { last = t; blink.phase ^= 1; draw(); }
      if (blink.on) blink.raf = requestAnimationFrame(frame);
    }
    blink.raf = requestAnimationFrame(frame);
  }

  /* ---------- upload ----------------------------------------------------- */

  function loadFile(file, which) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      var cap = 640;
      var sc = Math.min(1, cap / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.max(64, Math.round(img.naturalWidth * sc));
      var h = Math.max(64, Math.round(img.naturalHeight * sc));
      var c = R.offscreen(w, h), cc = c.getContext('2d');
      cc.drawImage(img, 0, 0, w, h);
      var d = cc.getImageData(0, 0, w, h);
      var rec = { g: Synth.fromImageData(d), w: w, h: h };
      if (which === 'a') S.pendingA = rec; else S.pendingB = rec;
      URL.revokeObjectURL(url);
      tryUploaded();
    };
    img.onerror = function () { URL.revokeObjectURL(url); toast('copy.fail'); };
    img.src = url;
  }

  function tryUploaded() {
    if (!S.pendingA || !S.pendingB) return;
    var A = S.pendingA, B = S.pendingB, note = '';
    var w = A.w, h = A.h, b = B.g;
    if (B.w !== w || B.h !== h) {
      var out = new Float32Array(w * h);
      for (var j = 0; j < h; j++) {
        for (var i = 0; i < w; i++) {
          out[j * w + i] = (i < B.w && j < B.h) ? B.g[j * B.w + i] : 0;
        }
      }
      b = out;
      note = 'upload.size';
    }
    S.uploaded = { a: A.g, b: b, w: w, h: h };
    S.picked = -1;
    if (note) toast(note);
    run(true);
  }

  function toast(key, raw) {
    var t = $('toast');
    t.textContent = raw || I18N.t(key);
    if (toast.timer) clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.textContent = ''; }, 4000);
  }

  function csv() {
    var res = S.res, lines = ['x_px,y_px,dx_px,dy_px,peak_R,snr,status'];
    for (var j = 0; j < res.ny; j++) {
      for (var i = 0; i < res.nx; i++) {
        var k = j * res.nx + i;
        lines.push([
          res.xs[i].toFixed(1), res.ys[j].toFixed(1),
          res.u[k].toFixed(4), res.v[k].toFixed(4),
          res.corr[k].toFixed(4), Math.min(99, res.snr[k]).toFixed(2),
          res.status[k]
        ].join(','));
      }
    }
    return lines.join('\n');
  }

  /* ---------- wiring ----------------------------------------------------- */

  function applyLang(next) {
    I18N.apply(next);
    buildFlowSelect();
    syncLabels();
    $('langBtn').textContent = I18N.t('app.langLabel');
    $('runBtn').textContent = I18N.t(S.res ? 'run.again' : 'run');
    $('stageHint').textContent = I18N.t(S.step === 2 ? 'stage.blink' : 'stage.hint');
    if (S.res) { updateMetrics(); drawInspector(); bgKey = ''; draw(); }
    store('lang', I18N.lang);
  }

  function bind() {
    var reshootIds = ['flowKind', 'dispRange', 'seedRange', 'dpRange', 'noiseRange', 'lossRange', 'sizeSelect'];
    var recomputeIds = ['winSelect', 'overlapSelect', 'passesSelect', 'subpixSelect', 'threshSelect'];
    var redrawIds = ['bgSelect', 'scaleRange', 'ovVectors', 'ovTruth', 'ovError', 'ovGrid'];

    reshootIds.forEach(function (id) {
      $(id).addEventListener('input', function () {
        readControls();
        if (S.uploaded && id !== 'flowKind') return;
        S.uploaded = null; S.pendingA = S.pendingB = null;
        run(false);
      });
    });
    recomputeIds.forEach(function (id) {
      $(id).addEventListener('input', function () { readControls(); run(false); });
    });
    redrawIds.forEach(function (id) {
      $(id).addEventListener('input', function () {
        readControls();
        updateBlink();
        bgKey = '';
        syncKeys();
        draw();
      });
    });

    $('runBtn').addEventListener('click', function () { run(true); });
    $('reshootBtn').addEventListener('click', function () {
      S.rngSeed = (Math.random() * 1e9) | 0;
      S.uploaded = null; S.pendingA = S.pendingB = null;
      $('fileA').value = ''; $('fileB').value = '';
      run(true);
    });

    var steps = document.querySelectorAll('.step');
    for (var i = 0; i < steps.length; i++) {
      steps[i].addEventListener('click', function () {
        setStep(+this.getAttribute('data-step'));
      });
    }

    $('sensor').addEventListener('click', function (e) { pickAt(e.clientX, e.clientY); });
    $('sensor').setAttribute('tabindex', '0');
    $('sensor').addEventListener('keydown', function (e) {
      if (!S.res) return;
      var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!d) return;
      e.preventDefault();
      var k = S.picked < 0 ? 0 : S.picked;
      var i2 = k % S.res.nx, j2 = (k - i2) / S.res.nx;
      i2 = Math.max(0, Math.min(S.res.nx - 1, i2 + d[0]));
      j2 = Math.max(0, Math.min(S.res.ny - 1, j2 + d[1]));
      inspect(j2 * S.res.nx + i2);
    });

    var modes = document.querySelectorAll('input[name="corrMode"]');
    for (i = 0; i < modes.length; i++) {
      modes[i].addEventListener('change', function () {
        S.corrMode = this.value;
        drawInspector();
      });
    }

    $('langBtn').addEventListener('click', function () {
      applyLang(I18N.lang === 'ko' ? 'en' : 'ko');
    });
    $('themeBtn').addEventListener('click', function () {
      S.themeMode = S.themeMode === 'auto'
        ? (S.theme === 'dark' ? 'light' : 'dark')
        : (S.themeMode === 'dark' ? 'light' : 'dark');
      resolveTheme();
      store('theme', S.themeMode);
      bgKey = '';
      draw(); drawInspector();
    });

    $('fileA').addEventListener('change', function () {
      if (this.files && this.files[0]) loadFile(this.files[0], 'a');
    });
    $('fileB').addEventListener('change', function () {
      if (this.files && this.files[0]) loadFile(this.files[0], 'b');
    });
    $('clearUpload').addEventListener('click', function () {
      S.uploaded = null; S.pendingA = S.pendingB = null;
      $('fileA').value = ''; $('fileB').value = '';
      $('dump').hidden = true;
      run(true);
    });
    $('copyCsv').addEventListener('click', function () {
      if (!S.res) return;
      var text = csv();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('copy.done'); },
          function () { showDump(text); });
      } else showDump(text);
    });

    var mq = root.matchMedia && root.matchMedia('(prefers-color-scheme: dark)');
    if (mq && mq.addEventListener) {
      mq.addEventListener('change', function () {
        if (S.themeMode === 'auto') { resolveTheme(); bgKey = ''; draw(); drawInspector(); }
      });
    }

    var rt;
    root.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { bgKey = ''; draw(); }, 120);
    });
  }

  function showDump(text) {
    var d = $('dump');
    d.value = text;
    d.hidden = false;
    d.select();
    toast('copy.fail');
  }

  /* ---------- boot ------------------------------------------------------- */

  function init() {
    var savedTheme = store('theme');
    if (savedTheme === 'light' || savedTheme === 'dark') S.themeMode = savedTheme;
    resolveTheme();
    var savedLang = store('lang');
    applyLang(savedLang === 'en' ? 'en' : 'ko');
    bind();
    readControls();
    shoot();
    compute(true);
    veil(null);
    setStep(0);
    $('runBtn').textContent = I18N.t('run.again');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else init();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
